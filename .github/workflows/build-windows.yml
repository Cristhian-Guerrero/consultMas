name: Build Windows Executable

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Compile for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Build and package app
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          python -m venv venv
          .\venv\Scripts\Activate.ps1

          python -m pip install --upgrade pip setuptools wheel
          pip install "numpy==1.26.4"
          if (Test-Path "requirements.txt") {
            pip install -r requirements.txt
          }

          pip install "pyinstaller>=6.6" pywin32-ctypes pefile

          pyinstaller --clean --noconfirm `
            --name="ConsultaDIAN" `
            --windowed `
            --onefile `
            --version-file="version_info.txt" `
            --add-data="logo.png;." `
            --add-data="dian.ico;." `
            --hidden-import=DrissionPage `
            --hidden-import=pandas `
            --hidden-import=openpyxl `
            --hidden-import=xlsxwriter `
            --hidden-import=PIL `
            --hidden-import=pygetwindow `
            --hidden-import=config `
            --hidden-import=core.browser `
            --hidden-import=core.scraper `
            --hidden-import=core.excel `
            --hidden-import=ui.app `
            --collect-all DrissionPage `
            --collect-all pandas `
            main.py

      - name: Verify build output
        shell: powershell
        run: |
          if (Test-Path "dist\ConsultaDIAN.exe") {
            Write-Host "✅ dist\ConsultaDIAN.exe creado exitosamente"
          } else {
            throw "❌ No se generó dist\ConsultaDIAN.exe"
          }

      # Nombre profesional y versionado: tags v* -> ConsultaDIAN-v4.14.1,
      # cualquier otro push (main/develop) -> ConsultaDIAN-Latest-<rama>.
      # Calculado una sola vez y reusado en el rename + en el artifact para
      # no duplicar la condición.
      - name: Set artifact name
        id: artifact_name
        if: always()
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "name=ConsultaDIAN-${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=ConsultaDIAN-Latest-${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename executable
        if: always()
        shell: powershell
        run: |
          Copy-Item "dist\ConsultaDIAN.exe" "dist\${{ steps.artifact_name.outputs.name }}.exe"

      # Pull requests: se compila igual (como validación de CI) pero no se
      # publica ningún artifact descargable.
      - name: Upload artifact
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: dist/${{ steps.artifact_name.outputs.name }}.exe
          retention-days: 30
